[project]
name = "zeitgeist"
version = "0.1.0"
description = "A living temporal knowledge graph of world events"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.5",
    "neo4j>=5.23",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "testcontainers[kafka,neo4j]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeitgeist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Docker (testcontainers)"]

[tool.ruff]
line-length = 100
