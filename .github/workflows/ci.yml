name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest tests/unit -q

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest tests/integration -q -m integration

  evals:
    # Prompt-accuracy gate: live eval run (Neo4j testcontainer + real Haiku calls,
    # ~$0.23) against the committed floors in evals/thresholds.json. Gates PRs that
    # touch prompt/eval files; runnable on demand via workflow_dispatch. Deliberately
    # NOT in deploy's needs — deploy is push-to-main, this gates PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            prompts:
              - src/zeitgeist/llm/extract.py
              - src/zeitgeist/agent/query.py
              - src/zeitgeist/resolver/judge.py
              - 'src/zeitgeist/evals/**'
              - 'evals/**'
      - uses: astral-sh/setup-uv@v5
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.prompts == 'true'
      - run: uv sync
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.prompts == 'true'
      - run: uv run python -m zeitgeist.evals.runner --suite all
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.prompts == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  deploy:
    runs-on: ubuntu-latest
    # Production deploy: only on direct pushes to main, only after all tests pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-unit, integration]
    steps:
      - uses: actions/checkout@v4
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Rsync and restart stack
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude .git --exclude .venv --exclude .pytest_cache --exclude .ruff_cache \
            --exclude state --exclude data --exclude evals \
            --exclude docs --exclude .superpowers --exclude .claude --exclude .env \
            ./ "root@${{ secrets.DEPLOY_HOST }}:/root/zeitgeist/"
          ssh -i ~/.ssh/deploy_key "root@${{ secrets.DEPLOY_HOST }}" \
            "cd /root/zeitgeist && docker compose -f docker/docker-compose.yml up -d --build"
