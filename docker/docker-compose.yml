services:
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:29092:29092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic raw.events --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic extracted.claims --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic llm.queue --partitions 6 --replication-factor 1

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-zeitgeist-dev}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      # NOTE: healthcheck env substitution across docker compose versions is unreliable,
      # so this intentionally keeps the literal default password rather than
      # $${NEO4J_PASSWORD:-zeitgeist-dev}. If you set a custom NEO4J_PASSWORD, the
      # healthcheck will report unhealthy even though Neo4j itself is fine.
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "zeitgeist-dev", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  ingestor:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.ingestor.main"]
    environment: &service-env
      KAFKA_BOOTSTRAP: kafka:9092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-zeitgeist-dev}
      STATE_PATH: /state/ingestor.json
      DASHBOARD_PATH: /app/dashboard/index.html
    volumes:
      - ingestor-state:/state
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  extractor:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.extractor.main"]
    environment: *service-env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  graph-writer:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.graph.main"]
    environment: *service-env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  sampler:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.sampler.main"]
    environment:
      <<: *service-env
      SAMPLER_BUDGET_STATE_PATH: /state/sampler_budget.json
      SAMPLER_MIN_SCORE: ${SAMPLER_MIN_SCORE:-1.2}
      LLM_MAX_CALLS_PER_DAY: ${LLM_MAX_CALLS_PER_DAY:-400}
    volumes:
      - sampler-state:/state
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.api.main"]
    environment: *service-env
    ports:
      - "8000:8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  llm-extractor:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.llm.main"]
    environment:
      <<: *service-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_BUDGET_STATE_PATH: /state/llm_budget.json
      LLM_MAX_CALLS_PER_DAY: ${LLM_MAX_CALLS_PER_DAY:-400}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5}
    volumes:
      - llm-state:/state
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  resolver:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.resolver.main"]
    environment:
      <<: *service-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ER_MAX_CALLS_PER_DAY: ${ER_MAX_CALLS_PER_DAY:-100}
      ER_BUDGET_STATE_PATH: /state/er_budget.json
    volumes:
      - resolver-state:/state
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
  neo4j-data:
  ingestor-state:
  sampler-state:
  llm-state:
  resolver-state:
