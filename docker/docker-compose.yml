x-service-env: &service-env
  KAFKA_BOOTSTRAP: kafka:9092
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-zeitgeist-dev}
  STATE_PATH: /state/ingestor.json
  DASHBOARD_PATH: /app/dashboard/index.html

services:
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
    ports:
      - "127.0.0.1:29092:29092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic raw.events --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic extracted.claims --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic llm.queue --partitions 6 --replication-factor 1

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-zeitgeist-dev}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:-zeitgeist-dev}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      # The password is injected into the container env (HEALTHCHECK_PASSWORD below — must NOT start with NEO4J_, the image maps that prefix to db config) and
      # expanded by the container's shell at check time ($$ escapes compose-level
      # interpolation). This keeps the healthcheck working with custom passwords —
      # the literal-password version reported unhealthy on any non-default password,
      # which silently blocked every service gated on neo4j health (found on VPS deploy).
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$HEALTHCHECK_PASSWORD\" 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  ingestor:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.ingestor.main"]
    environment:
      <<: *service-env
      METRICS_PORT: 9101
    volumes:
      - ingestor-state:/state
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  extractor:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.extractor.main"]
    environment:
      <<: *service-env
      METRICS_PORT: 9102
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  graph-writer:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.graph.main"]
    environment:
      <<: *service-env
      METRICS_PORT: 9105
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  sampler:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.sampler.main"]
    environment:
      <<: *service-env
      METRICS_PORT: 9103
      SAMPLER_BUDGET_STATE_PATH: /state/sampler_budget.json
      SAMPLER_MIN_SCORE: ${SAMPLER_MIN_SCORE:-1.2}
      LLM_MAX_CALLS_PER_DAY: ${LLM_MAX_CALLS_PER_DAY:-400}
    volumes:
      - sampler-state:/state
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.api.main"]
    environment: *service-env
    ports:
      # Loopback-only since Caddy fronts the public HTTPS door; direct :8000 stays
      # available on the server itself for health checks and SSH-tunnel access.
      - "127.0.0.1:8000:8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  llm-extractor:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.llm.main"]
    environment:
      <<: *service-env
      METRICS_PORT: 9104
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_BUDGET_STATE_PATH: /state/llm_budget.json
      LLM_MAX_CALLS_PER_DAY: ${LLM_MAX_CALLS_PER_DAY:-400}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5}
    volumes:
      - llm-state:/state
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  resolver:
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "zeitgeist.resolver.main"]
    environment:
      <<: *service-env
      METRICS_PORT: 9106
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ER_MAX_CALLS_PER_DAY: ${ER_MAX_CALLS_PER_DAY:-100}
      ER_BUDGET_STATE_PATH: /state/er_budget.json
    volumes:
      - resolver-state:/state
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-zeitgeist-dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  kafka-data:
  neo4j-data:
  ingestor-state:
  sampler-state:
  llm-state:
  resolver-state:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
