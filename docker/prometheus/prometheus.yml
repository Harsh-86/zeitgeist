global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ingestor
    static_configs:
      - targets: ["ingestor:9101"]

  - job_name: extractor
    static_configs:
      - targets: ["extractor:9102"]

  - job_name: sampler
    static_configs:
      - targets: ["sampler:9103"]

  - job_name: llm-extractor
    static_configs:
      - targets: ["llm-extractor:9104"]

  - job_name: graph-writer
    static_configs:
      - targets: ["graph-writer:9105"]

  - job_name: resolver
    static_configs:
      - targets: ["resolver:9106"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
